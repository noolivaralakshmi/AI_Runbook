<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #e63946; }
        input::placeholder { color: rgba(255,255,255,0.2); }
        .btn { width: 100%; padding: 12px; background: #e63946; border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #c1121f; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-box { display: none; background: rgba(230,57,70,0.1); border: 1px solid rgba(230,57,70,0.3); border-radius: 8px; padding: 12px 16px; margin-top: 16px; font-size: 13px; }
        .error-title { color: #e63946; font-weight: 600; margin-bottom: 4px; }
        .error-detail { color: rgba(255,255,255,0.5); font-family: monospace; font-size: 11px; word-break: break-all; }
        .test-creds { margin-top: 24px; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; font-size: 12px; color: rgba(255,255,255,0.3); }
        .test-creds code { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Sign In</h1>
        <p class="subtitle">Enter your credentials to access the dashboard</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>
        <div class="error-box" id="errorBox">
            <div class="error-title" id="errorTitle">Error</div>
            <div class="error-detail" id="errorDetail"></div>
        </div>
        <div class="test-creds">
            Test credentials: <code>admin</code> / <code>admin123</code>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('errorBox');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorBox.style.display = 'none';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorBox.style.display = 'block';
                    document.getElementById('errorTitle').textContent = res.status === 500 ? '500 Internal Server Error' : res.status + ' Error';
                    document.getElementById('errorDetail').textContent = data.trace || data.message || data.error;
                }
            } catch (err) {
                errorBox.style.display = 'block';
                document.getElementById('errorTitle').textContent = 'Connection Error';
                document.getElementById('errorDetail').textContent = err.message;
            }
            btn.disabled = false;
            btn.textContent = 'Sign In';
        });
    </script>
</body>
</html>
